image:
  tag: nightly-20260511

rollout:
  autoPromotionEnabled: true

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/hostname: bakery-qa.usfcar.xyz
  hosts:
    - host: bakery-qa.usfcar.xyz
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts: [bakery-qa.usfcar.xyz]
      secretName: bakery-qa-tls
