# Production environment overrides for catalog-svc.
# CI updates `image.tag` here only on release tag push (v*).
# autoPromotionEnabled=true: prod Blue/Green Rollouts bring up the new version,
# run readiness checks, then auto-cut traffic over once the new pods are healthy.
image:
  tag: v1.1.0

replicaCount: 2

rollout:
  autoPromotionEnabled: true
