image:
  tag: sha-b0ec508

rollout:
  autoPromotionEnabled: true

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/hostname: bakery.usfcar.xyz
  hosts:
    - host: bakery.usfcar.xyz
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts: [bakery.usfcar.xyz]
      secretName: bakery-tls
