fullnameOverride: catalog
runtime: java

image:
  repository: catalog-svc
  tag: latest

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    cpu: 500m
    memory: 768Mi

probes:
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 90
    periodSeconds: 10
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 30
    periodSeconds: 5

db:
  schema: catalog

metrics:
  path: /actuator/prometheus

# Lower JVM DNS cache so the bakery-db ExternalName Service picks up RDS
# endpoint changes after destroy/recreate without needing a pod restart.
extraEnv:
  - name: JAVA_TOOL_OPTIONS
    value: "-Dnetworkaddress.cache.ttl=30 -Dnetworkaddress.cache.negative.ttl=10"
