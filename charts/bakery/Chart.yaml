apiVersion: v2
name: bakery
description: Umbrella chart that deploys the full Carissa Bakery stack (catalog, inventory, orders, web)
type: application
version: 0.1.0
appVersion: "0.1.0"

dependencies:
  - name: bakery-backend
    alias: catalog
    version: 0.1.0
    repository: "file://../bakery-backend"
  - name: bakery-backend
    alias: inventory
    version: 0.1.0
    repository: "file://../bakery-backend"
  - name: bakery-backend
    alias: orders
    version: 0.1.0
    repository: "file://../bakery-backend"
  - name: web
    version: 0.1.0
    repository: "file://../web"
  - name: postgresql
    version: 16.0.6
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
