name: Promote image tag in gitops values

on:
  workflow_run:
    workflows: ["Build and push images"]
    types: [completed]
    # No `branches:` filter — we also need this to fire for tag builds (v*),
    # which run on a tag ref, not a branch. The job logic distinguishes
    # tag pushes (-> prod) from main pushes (-> uat) via head_branch.

permissions:
  contents: write

jobs:
  promote:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
          # Full history so the merge-commit walk below can reach the
          # non-merge ancestor (a shallow clone only has the tip commit).
          fetch-depth: 0

      - name: Determine target environment and image tag
        id: target
        run: |
          set -euo pipefail
          HEAD_BRANCH="${{ github.event.workflow_run.head_branch }}"
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          SHORT_SHA="${HEAD_SHA:0:7}"
          EVENT="${{ github.event.workflow_run.event }}"

          # Tag pushes trigger the build with event=push but head_branch is the
          # tag name itself when it matches a refs/tags/* pattern. The
          # build-and-push workflow only runs on main pushes and v* tags.
          if [[ "$HEAD_BRANCH" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "env=prod" >> "$GITHUB_OUTPUT"
            echo "tag=$HEAD_BRANCH" >> "$GITHUB_OUTPUT"
            echo "Tag push detected: $HEAD_BRANCH -> prod"
          else
            # Push to main. Only promote if the head commit is a Conventional Commit.
            COMMIT_MSG=$(git log -1 --pretty=%s "$HEAD_SHA")
            echo "Commit subject: $COMMIT_MSG"
            # If head is a merge commit (from `git pull` without --rebase), walk
            # to the most recent non-merge ancestor for the conventional-commit
            # check. The image is still tagged with the head SHA.
            if [[ "$COMMIT_MSG" =~ ^Merge ]]; then
              COMMIT_MSG=$(git log --no-merges -1 --pretty=%s "$HEAD_SHA")
              echo "Head is a merge commit. Using non-merge ancestor: $COMMIT_MSG"
            fi
            if [[ "$COMMIT_MSG" =~ ^(feat|fix|refactor|perf|build|ci|chore|docs|style|test|revert)(\(.+\))?!?: ]]; then
              echo "env=uat" >> "$GITHUB_OUTPUT"
              echo "tag=sha-$SHORT_SHA" >> "$GITHUB_OUTPUT"
              echo "Conventional commit detected -> uat"
            else
              echo "env=skip" >> "$GITHUB_OUTPUT"
              echo "Not a Conventional Commit. Skipping promotion."
            fi
          fi

      - name: Update values files
        if: steps.target.outputs.env != 'skip'
        env:
          ENV: ${{ steps.target.outputs.env }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          for svc in catalog inventory orders web; do
            file="charts/values/${svc}-${ENV}.yaml"
            echo "Updating $file -> tag: $TAG"
            # Replace the line `  tag: ...` under `image:`. Match exactly two-space
            # indent so we don't touch nested image: blocks elsewhere.
            sed -i -E "s|^(  tag: ).*|\1${TAG}|" "$file"
          done
          git diff --stat

      - name: Commit and push
        if: steps.target.outputs.env != 'skip'
        env:
          ENV: ${{ steps.target.outputs.env }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/values/
          git commit -m "chore(release): promote ${TAG} to ${ENV}"
          git push
