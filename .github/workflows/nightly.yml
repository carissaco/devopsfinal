name: Nightly QA build

on:
  schedule:
    # 09:00 UTC = 02:00 PT. Nightly cutoff for "today's" QA build.
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "014516479340"
  ROLE_ARN: arn:aws:iam::014516479340:role/github-actions-ecr-push

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: catalog-svc
            context: apps/catalog-svc
          - service: inventory-svc
            context: apps/inventory-svc
          - service: orders-svc
            context: apps/orders-svc
          - service: web
            context: apps/web
            build_args: |
              VITE_CATALOG_URL=/api/catalog
              VITE_INVENTORY_URL=/api/inventory
              VITE_ORDERS_URL=/api/orders

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ matrix.service }}
          tags: |
            type=raw,value=nightly-{{date 'YYYYMMDD'}}
            type=raw,value=nightly

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  promote-qa:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute nightly tag
        id: tag
        run: echo "tag=nightly-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Update QA values files
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          for svc in catalog inventory orders web; do
            file="charts/values/${svc}-qa.yaml"
            echo "Updating $file -> tag: $TAG"
            sed -i -E "s|^(  tag: ).*|\1${TAG}|" "$file"
          done
          git diff --stat

      - name: Commit and push
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No QA changes to commit (nightly tag unchanged)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/values/
          git commit -m "chore(qa): promote ${TAG} to qa"
          git push
