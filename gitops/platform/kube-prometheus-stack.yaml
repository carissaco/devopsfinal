apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 62.7.0
    helm:
      releaseName: kube-prometheus-stack
      values: |
        alertmanager:
          enabled: true
          alertmanagerSpec:
            # Mount the SMTP secret so the alertmanager config can read the
            # password via auth_password_file (avoids password-in-config).
            secrets:
              - alertmanager-smtp
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
          config:
            global:
              resolve_timeout: 5m
              smtp_smarthost: "smtp.gmail.com:587"
              smtp_from: "carissahvc@gmail.com"
              smtp_auth_username: "carissahvc@gmail.com"
              smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-smtp/password
              smtp_require_tls: true
            route:
              group_by: ["alertname", "namespace"]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 12h
              receiver: gmail
              routes:
                - matchers:
                    - severity = "critical"
                  receiver: gmail
            receivers:
              - name: gmail
                email_configs:
                  - to: "carissahvc@gmail.com"
                    send_resolved: true

        # A custom rule that's easy to demo: fires when any pod restarts more
        # than once in 5 minutes. Triggerable by killing a pod twice.
        additionalPrometheusRulesMap:
          bakery-demo:
            groups:
              - name: bakery.demo
                rules:
                  - alert: BakeryPodRestartingFrequently
                    expr: increase(kube_pod_container_status_restarts_total{namespace=~"bakery.*"}[5m]) > 1
                    for: 1m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} restarting frequently"
                      description: "{{ $labels.namespace }}/{{ $labels.pod }} has restarted more than once in the last 5 minutes."

        prometheus:
          prometheusSpec:
            retention: 1d
            resources:
              requests:
                cpu: 200m
                memory: 1Gi
              limits:
                memory: 2Gi
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false

        grafana:
          # Pull GitHub OAuth client_id + client_secret from a k8s Secret
          # named grafana-github-oauth (created out-of-band by kubectl).
          envFromSecret: grafana-github-oauth
          # Disable the static admin password — OAuth is the only way in.
          admin:
            existingSecret: ""
          adminPassword: ""
          persistence:
            enabled: true
            size: 2Gi
          defaultDashboardsEnabled: true
          additionalDataSources:
            - name: Loki
              type: loki
              access: proxy
              url: http://loki-gateway.logging.svc.cluster.local
              jsonData:
                maxLines: 1000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
          grafana.ini:
            server:
              root_url: https://grafana.usfcar.xyz
            users:
              # Every new user signed up via GitHub OAuth lands as Admin.
              # Demo-grade — for real prod, restrict via team_ids or
              # allowed_organizations on auth.github and use role_attribute_path
              # to map team membership to roles.
              auto_assign_org_role: Admin
            auth:
              # Disable username/password — rubric forbids it for prod access.
              disable_login_form: true
            "auth.basic":
              enabled: false
            "auth.github":
              enabled: true
              # Sign-up disabled: only pre-existing Grafana users (carissaco, the
              # initial OAuth signup) can authenticate. Random GitHub users that
              # complete the OAuth flow get a "User signup is not allowed" error.
              # In real prod this would be paired with allowed_organizations and
              # role_attribute_path mapping team membership to roles.
              allow_sign_up: false
              client_id: $__env{GF_AUTH_GITHUB_CLIENT_ID}
              client_secret: $__env{GF_AUTH_GITHUB_CLIENT_SECRET}
              scopes: "user:email,read:org"
              auth_url: https://github.com/login/oauth/authorize
              token_url: https://github.com/login/oauth/access_token
              api_url: https://api.github.com/user
          ingress:
            enabled: true
            ingressClassName: nginx
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
              external-dns.alpha.kubernetes.io/hostname: grafana.usfcar.xyz
            hosts:
              - grafana.usfcar.xyz
            tls:
              - hosts:
                  - grafana.usfcar.xyz
                secretName: grafana-tls

        kube-state-metrics:
          resources:
            requests:
              cpu: 25m
              memory: 64Mi

        prometheus-node-exporter:
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
