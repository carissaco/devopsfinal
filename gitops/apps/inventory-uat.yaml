apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: inventory-uat
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/carissaco/devopsfinal.git
    targetRevision: main
    path: charts/bakery-backend
    helm:
      releaseName: inventory
      valueFiles:
        - ../values/inventory.yaml
        - ../values/inventory-uat.yaml
      parameters:
        - name: image.repository
          value: 014516479340.dkr.ecr.us-east-1.amazonaws.com/inventory-svc
  destination:
    server: https://kubernetes.default.svc
    namespace: bakery
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
